<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart clone</title>
    <link rel="stylesheet" href="flipkart clone.css">

    <style>
        /* base style for mobile devices */
        body{
                background-color: skyblue;
                color: white;
        }

         /* for devices with a minimum width of 700px(minimum) */
         @media screen and (min-width:750px){
            body{
                background-color: limegreen;
                color: aqua;
            }
         }

         /* for devices with a minimum width od 1100px(large) */
         @media screen and (min-width:1100px){
            body{
                background-color: blue;
                color:blueviolet
            }
         }
    </style>
</head>
<body>
    <header>
        <div class="logo">Flipkart Clone</div>

        <input type="text" placeholder="search the products">

        <nav>
            <a href="#">login</a>
            <a href="#">cart</a>
            <a href="#">become a selller</a>
        </nav>
    </header>
    <section class="catogery">
        <div>mobile</div>
        <div>laptop</div>
        <div>electronics</div>
        <div>fashion</div>
        <div>travel</div>
     </section>
     <section class="banner">
     <img src="https://images.unsplash.com/photo-1654573817889-296cad084c97?q=80&w=1162&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
   </section>

   <section class="products">
     <div class="card">
      <img src="https://media.istockphoto.com/id/2259786061/photo/iphone-17-next-to-iphone-16-in-comparison.jpg?s=612x612&w=0&k=20&c=ZBa63WReIehu_ek8Mf0iYoU3UvSZDVCV9X2mBN14ufA=">
      <h3>smartpphone</h3>
      <p>24,999</p>
     </div>

     <div class="card">
        <img src="https://media.istockphoto.com/id/1883285965/photo/an-unrecognizable-businesswoman-working-in-her-office-on-her-computer.jpg?s=612x612&w=0&k=20&c=gGxCXAwnjSYtoYBxe3IviqIzkJc0WLTdmhUXpQxpcw8=">
         <h3>laptop</h3>
         <p>54,999</p>
     </div>

   </section>
   
   <footer>
    <p>2026 flipkart clone</p>
   </footer>


    
</body>
</html>
